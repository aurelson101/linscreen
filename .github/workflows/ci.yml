name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            appstream \
            build-essential \
            cmake \
            desktop-file-utils \
            dpkg-dev \
            git \
            libgl-dev \
            ninja-build \
            qt6-base-dev \
            qt6-l10n-tools \
            qt6-svg-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-wayland tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng

      - name: Build
        run: tools/package-linscreen-deb.sh build-linscreen-ci

      - name: Validate metadata
        run: |
          appstreamcli validate --no-net data/appdata/org.linscreen.LinScreen.metainfo.xml
          desktop-file-validate data/desktopEntry/package/org.linscreen.LinScreen.desktop

      - name: Smoke test
        run: |
          build-linscreen-ci/src/linscreen --version
          ctest --test-dir build-linscreen-ci --output-on-failure
          DESTDIR="$PWD/build-linscreen-ci/stage" cmake --install build-linscreen-ci
          tools/validate-linscreen-install.sh build-linscreen-ci/stage /usr
          dpkg-deb -I build-linscreen-ci/linscreen_*.deb
          sudo apt-get install --yes --no-install-recommends ./build-linscreen-ci/linscreen_*.deb
          dpkg --audit

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linscreen-linux-packages
          path: |
            build-linscreen-ci/linscreen_*.deb
            build-linscreen-ci/linscreen-*-linux.tar.gz
