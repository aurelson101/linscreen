name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Flatpak tooling and runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends flatpak flatpak-builder jq
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.kde.Platform//6.10 org.kde.Sdk//6.10
      - name: Build and test Flatpak
        run: tools/package-linscreen-flatpak.sh
      - name: Validate installed bundle and bundled OCR
        run: |
          flatpak install --user --noninteractive -y build-linscreen-flatpak/LinScreen-*-x86_64.flatpak
          flatpak run org.linscreen.LinScreen --version
          flatpak run --command=tesseract org.linscreen.LinScreen --list-langs
          helper="$(find "$PWD/build-linscreen-flatpak/state/build" -path '*/tests/linscreen_ocr_test' -type f -print -quit)"
          test -n "$helper"
          flatpak run --env=QT_QPA_PLATFORM=offscreen --filesystem="$helper:ro" \
            --command="$helper" org.linscreen.LinScreen --real
      - name: Upload Flatpak
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linscreen-flatpak
          if-no-files-found: error
          path: build-linscreen-flatpak/LinScreen-*-x86_64.flatpak

  deb:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            appstream \
            build-essential \
            cmake \
            curl \
            desktop-file-utils \
            dpkg-dev \
            file \
            git \
            libgl-dev \
            ninja-build \
            qt6-base-dev \
            qt6-l10n-tools \
            qt6-svg-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-wayland tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng

      - name: Build packages
        run: |
          tools/package-linscreen-deb.sh build-linscreen-release
          tools/package-linscreen-appimage.sh build-linscreen-appimage
          install -m 0755 \
            build-linscreen-appimage/LinScreen-*-x86_64.AppImage \
            build-linscreen-release/

      - name: Read version
        id: version
        run: |
          version="$(sed -n 's/^set(LINSCREEN_VERSION[[:space:]]*\([0-9][^)]*\)).*/\1/p' CMakeLists.txt | head -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: build-linscreen-release
          format: cyclonedx-json
          output-file: build-linscreen-release/LinScreen-${{ steps.version.outputs.version }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Validate release packages
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          ctest --test-dir build-linscreen-release --output-on-failure
          build-linscreen-release/LinScreen-*-x86_64.AppImage --version
          appstreamcli validate --no-net data/appdata/org.linscreen.LinScreen.metainfo.xml
          desktop-file-validate data/desktopEntry/package/org.linscreen.LinScreen.desktop
          sudo apt-get install --yes --no-install-recommends ./build-linscreen-release/linscreen_*.deb
          linscreen --version
          dpkg --audit

      - name: Upload Linux packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linscreen-release-linux
          if-no-files-found: error
          path: |
            build-linscreen-release/linscreen_*.deb
            build-linscreen-release/linscreen-*-linux.tar.gz
            build-linscreen-release/LinScreen-*-x86_64.AppImage
            build-linscreen-release/LinScreen-*.cdx.json

  publish:
    needs: [deb, flatpak]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download validated packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: linscreen-*
          merge-multiple: true
          path: release-assets
      - name: Checksums
        run: |
          cd release-assets
          sha256sum \
            linscreen_*.deb \
            linscreen-*-linux.tar.gz \
            LinScreen-*-x86_64.AppImage \
            LinScreen-*-x86_64.flatpak \
            LinScreen-*.cdx.json > SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums with GitHub OIDC
        run: |
          cosign sign-blob --yes \
            --bundle release-assets/SHA256SUMS.sigstore.json \
            release-assets/SHA256SUMS

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: LinScreen ${{ needs.deb.outputs.version }}
          body_path: docs/releases/v${{ needs.deb.outputs.version }}.md
          files: |
            release-assets/linscreen_*.deb
            release-assets/linscreen-*-linux.tar.gz
            release-assets/LinScreen-*-x86_64.AppImage
            release-assets/LinScreen-*-x86_64.flatpak
            release-assets/LinScreen-*.cdx.json
            release-assets/SHA256SUMS
            release-assets/SHA256SUMS.sigstore.json
