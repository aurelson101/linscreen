name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            appstream \
            build-essential \
            cmake \
            curl \
            desktop-file-utils \
            dpkg-dev \
            file \
            git \
            libgl-dev \
            ninja-build \
            qt6-base-dev \
            qt6-l10n-tools \
            qt6-svg-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-wayland

      - name: Build packages
        run: |
          tools/package-linscreen-deb.sh build-linscreen-release
          tools/package-linscreen-appimage.sh build-linscreen-appimage
          install -m 0755 \
            build-linscreen-appimage/LinScreen-*-x86_64.AppImage \
            build-linscreen-release/

      - name: Read version
        id: version
        run: |
          version="$(sed -n 's/^set(LINSCREEN_VERSION[[:space:]]*\([0-9][^)]*\)).*/\1/p' CMakeLists.txt | head -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: build-linscreen-release
          format: cyclonedx-json
          output-file: build-linscreen-release/LinScreen-${{ steps.version.outputs.version }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Validate release packages
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          ctest --test-dir build-linscreen-release --output-on-failure
          build-linscreen-release/LinScreen-*-x86_64.AppImage --version
          appstreamcli validate --no-net data/appdata/org.linscreen.LinScreen.metainfo.xml
          desktop-file-validate data/desktopEntry/package/org.linscreen.LinScreen.desktop
          sudo apt-get install --yes --no-install-recommends ./build-linscreen-release/linscreen_*.deb
          linscreen --version
          dpkg --audit

      - name: Checksums
        run: |
          cd build-linscreen-release
          sha256sum \
            linscreen_*.deb \
            linscreen-*-linux.tar.gz \
            LinScreen-*-x86_64.AppImage \
            LinScreen-*.cdx.json > SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums with GitHub OIDC
        run: |
          cosign sign-blob --yes \
            --bundle build-linscreen-release/SHA256SUMS.sigstore.json \
            build-linscreen-release/SHA256SUMS

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: LinScreen ${{ steps.version.outputs.version }}
          body_path: docs/releases/v${{ steps.version.outputs.version }}.md
          files: |
            build-linscreen-release/linscreen_*.deb
            build-linscreen-release/linscreen-*-linux.tar.gz
            build-linscreen-release/LinScreen-*-x86_64.AppImage
            build-linscreen-release/LinScreen-*.cdx.json
            build-linscreen-release/SHA256SUMS
            build-linscreen-release/SHA256SUMS.sigstore.json
