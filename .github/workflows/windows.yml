name: Windows package

on:
  push:
    branches: [main, master, 'agent/**']
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.package.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: '6.9.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wixtoolset --no-progress --yes

      - name: Build Windows packages
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $isRelease = "${{ startsWith(github.ref, 'refs/tags/v') }}" -eq "true"
          $certificatePath = Join-Path $env:RUNNER_TEMP "linscreen-code-signing.pfx"
          $signingArguments = @()

          if ($env:WINDOWS_CERTIFICATE_BASE64) {
            if ($isRelease -and -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
              throw "WINDOWS_CERTIFICATE_PASSWORD is required for a release tag."
            }
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
            )
            $signingArguments += @(
              "-SigningCertificatePath", $certificatePath,
              "-SigningCertificatePassword", $env:WINDOWS_CERTIFICATE_PASSWORD
            )
          } elseif ($isRelease) {
            throw "WINDOWS_CERTIFICATE_BASE64 is required for a release tag."
          }

          if ($isRelease) {
            $signingArguments += "-RequireSigning"
          }

          ./tools/package-linscreen-windows.ps1 `
            -BuildDir build-linscreen-windows `
            -Generator "Visual Studio 17 2022" `
            @signingArguments
          ./tools/package-linscreen-windows.ps1 `
            -BuildDir build-linscreen-windows-portable `
            -Generator "Visual Studio 17 2022" `
            -Portable `
            @signingArguments

      - name: Verify artifacts
        id: package
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern '^set\(LINSCREEN_VERSION\s+([^\)]+)\)').Matches.Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $packages = Get-ChildItem build-linscreen-windows -File |
            Where-Object { $_.Extension -in '.msi', '.zip' }
          if (-not ($packages | Where-Object Extension -eq '.msi')) {
            throw 'The Windows MSI installer was not generated.'
          }
          $portablePackages = Get-ChildItem build-linscreen-windows-portable -File |
            Where-Object Extension -eq '.zip'
          if (-not $portablePackages) {
            throw 'The Windows portable ZIP was not generated.'
          }
          $packages + $portablePackages | Format-Table Name, Length

      - name: Upload Windows packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LinScreen-${{ steps.package.outputs.version }}-Windows
          if-no-files-found: error
          path: |
            build-linscreen-windows/*.msi
            build-linscreen-windows-portable/*.zip

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath "$env:RUNNER_TEMP/linscreen-code-signing.pfx" -Force -ErrorAction SilentlyContinue

  publish-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download signed Windows packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: LinScreen-${{ needs.windows.outputs.version }}-Windows
          path: dist/windows

      - name: Attach Windows packages to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/windows/*
          fail_on_unmatched_files: true
