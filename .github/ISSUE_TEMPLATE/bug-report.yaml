name: Bug Report
description: Report a LinScreen problem.
labels: ["bug"]
body:
  - type: textarea
    id: version
    attributes:
      label: LinScreen version
      description: Paste the output of `linscreen --version`.
      placeholder: LinScreen v14.0.0 (...)
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, desktop environment, display server, portal backend, and monitor layout.
      placeholder: Ubuntu 24.04, GNOME/KDE, Wayland/X11, one or more monitors.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the failure and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `linscreen gui`
        2. Select a region
        3. Save or copy the capture
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: On Wayland, run `tools/wayland-capture-debug.sh` when possible and paste relevant output.
    validations:
      required: false
